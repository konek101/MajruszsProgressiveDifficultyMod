name: Build

on:
  push:
    branches: [ "main", "master", "1.20.X" ]
  pull_request:
    branches: [ "main", "master", "1.20.X" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-home-cache-cleanup: true
        
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Build with Gradle
      run: ./gradlew build --no-daemon --stacktrace
      env:
        # Increase timeout for dependency downloads
        GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dhttp.socketTimeout=60000 -Dhttp.connectionTimeout=60000"
        
    - name: Upload Fabric artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: majruszs-difficulty-fabric
        path: fabric/build/libs/*.jar
        if-no-files-found: warn
        
    - name: Upload Forge artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: majruszs-difficulty-forge
        path: forge/build/libs/*.jar
        if-no-files-found: warn
        
    - name: Upload NeoForge artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: majruszs-difficulty-neoforge
        path: neoforge/build/libs/*.jar
        if-no-files-found: warn
