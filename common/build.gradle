buildscript {
    repositories {
        mavenCentral()
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'java'
    id 'org.spongepowered.gradle.vanilla' version '0.2.1-SNAPSHOT'
    id 'maven-publish'
}

base {
    archivesName = "${mod_archives_name}-common-${minecraft_version}-${mod_version}"
}

minecraft {
    version(minecraft_version)
}

repositories {
    mavenCentral()
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases'
    }
}

afterEvaluate {
    configurations.all {
        if (it.canBeResolved) {
            it.resolutionStrategy.eachDependency { details ->
                // Force use of project repositories
            }
        }
    }
}

dependencies {
    compileOnly files('libs/mixin-0.8.5.jar')
    implementation files('libs/majrusz-library-common-1.20.1-7.0.4.jar')
    mergetool files('libs/mergetool-1.2.3.jar')
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(17))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
